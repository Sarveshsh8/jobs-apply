[project]
name = "job-apply"
version = "0.1.0"
description = "LinkedIn remote job search & filter tool"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40",
    "pyyaml>=6.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
job-search = "job_search.cli:main"
